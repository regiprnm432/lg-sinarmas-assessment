server:
  port: 8080

spring:
  application:
    name: procurement-fx
  datasource:
    url: jdbc:h2:mem:procurement_fx;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password: 
  h2:
    console:
      enabled: true
      path: /h2-console
      settings:
        web-allow-others: true
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true

app:
  base-currency: USD
  frankfurter:
    base-url: https://api.frankfurter.dev/v1/latest
    timeout-millis: 4000
    cache-ttl-hours: 24

logging:
  level:
    com.procurement.fx: DEBUG
    org.springframework.web: INFO
